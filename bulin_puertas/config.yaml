name: Bulín Puertas
version: "1.0.1"
slug: bulin_puertas
description: Puertas de la casa (Nuki, Danalock, portales Shelly) conectadas al Panel de El Bulín, sin Availroom. Independiente de Revenue.
url: https://github.com/nashga/bulin360-revenue-worker-ha
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:door-open
panel_title: Puertas
homeassistant_api: true
options:
  panel_url: "https://www.elbulin.es/operaciones/admin-nuevo/api/"
  panel_token: ""
  portals: []
  hide: []
  confirm: true
schema:
  panel_url: url?
  panel_token: password?
  portals:
    - entity_id: str
      name: str?
  hide:
    - str
  confirm: bool
